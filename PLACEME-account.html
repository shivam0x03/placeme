<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLACEME account</title><style>body{font:16px system-ui;background:#f3f7f3;color:#10352d;padding:2rem}main{max-width:520px;margin:auto;background:white;padding:2rem;border-radius:20px}button,a{font:inherit}button{padding:10px;background:#174b3e;color:white;border:0;border-radius:8px}</style><main><h1>Your PLACEME account</h1><p id="status" role="status">Checking your session…</p><section id="details" hidden><p id="phone"></p><p id="city"></p><p id="email"></p><a href="index.html">Explore PLACEME</a><p><button id="logout">Sign out</button></p></section><a href="PLACEME-login.html" id="login" hidden>Sign in</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-config.js"></script><script>
(async()=>{const $=id=>document.getElementById(id),cfg=window.PLACEME_AUTH||{};try{if(!cfg.url||!cfg.publishableKey)throw Error("Authentication is not configured.");const c=supabase.createClient(cfg.url,cfg.publishableKey);const {data,error}=await c.auth.getUser();if(error||!data.user)throw Error("Please sign in.");const u=data.user;$("phone").textContent="Phone: +"+String(u.phone||"").replace(/^\+/,"");$("city").textContent="City: "+(u.user_metadata.city||"");$("email").textContent="Contact email (unverified): "+(u.user_metadata.contact_email||"");$("status").textContent="Signed in";$("details").hidden=false;$("logout").onclick=async()=>{const {error}=await c.auth.signOut();if(error){$("status").textContent=error.message;return;}location.replace("PLACEME-login.html");};}catch(e){$("status").textContent=e.message;$("login").hidden=false;}})();
</script></html>
